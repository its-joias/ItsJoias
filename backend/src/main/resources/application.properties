spring.application.name=itsjoias

# ---------------------------------------------------------------------
# Banco de dados (PostgreSQL)
# Os valores vêm de variáveis de ambiente. A senha NUNCA é escrita aqui.
#   DB_URL       padrão: jdbc:postgresql://localhost:5432/its_joias
#   DB_USERNAME  padrão: postgres
#   DB_PASSWORD  obrigatória (sem ela, o PostgreSQL recusa a conexão com o erro
#                "autenticação do tipo senha falhou" e a aplicação não sobe)
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/its_joias}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
# cada conexão usa o fuso de São Paulo (senão "hoje" erra depois das 21h)
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Sao_Paulo'
# poucas conexões: o pooler do Supabase no plano gratuito aceita poucas ao mesmo tempo
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}

# ---------------------------------------------------------------------
# JPA / Hibernate
# O banco é criado à mão (database/its_joias_banco.sql).
# O Hibernate só confere se as entidades batem com ele; nunca cria nem altera tabelas.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
# a conexão com o banco não fica presa durante a montagem da resposta
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ---------------------------------------------------------------------
# Servidor
# O Render (e serviços parecidos) informa a porta em PORT; na máquina local é 8080.
# ---------------------------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------------------------
# Login (Supabase Auth)
#   SUPABASE_URL              ex.: https://<ref-do-projeto>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  chave PÚBLICA do projeto (sb_publishable_...). Não é segredo.
#   SUPABASE_JWT_SECRET       só se o projeto usar o segredo antigo (HS256); senão, deixe vazio.
# NUNCA use aqui a chave service_role: o back não precisa dela.
# ---------------------------------------------------------------------
itsjoias.supabase.url=${SUPABASE_URL:}
itsjoias.supabase.chave-publica=${SUPABASE_PUBLISHABLE_KEY:}
itsjoias.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}

# ---------------------------------------------------------------------
# CORS: endereços de onde o front pode chamar esta API (separados por vírgula; aceita *).
# Padrão: site da Vercel, previews da Vercel e a máquina local.
# ---------------------------------------------------------------------
itsjoias.cors.origens=${CORS_ORIGENS:https://itsjoias.vercel.app,https://itsjoias-*-b0l4da.vercel.app,http://localhost:*,http://127.0.0.1:*}

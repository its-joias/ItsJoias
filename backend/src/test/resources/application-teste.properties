# ---------------------------------------------------------------------
# Banco dos testes de integração (perfil "teste").
# Use um banco SÓ PARA TESTE, vazio, criado com database/its_joias_banco.sql
# + os arquivos de database/alteracoes. Nunca aponte para o Supabase.
#   TEST_DB_URL       padrão: jdbc:postgresql://localhost:5432/its_joias_teste
#   TEST_DB_USERNAME  padrão: postgres
#   TEST_DB_PASSWORD  padrão: vazio
# ---------------------------------------------------------------------
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/its_joias_teste}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Organização Its Joias</title>
    <meta name="theme-color" content="#0E1728">
    <script src="js/tema.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="pagina-login">
        <div class="tema-login" data-botao-tema></div>
        <section class="cartao-login" aria-labelledby="titulo-login">
            <h1 id="titulo-login">Its Joias</h1>
            <p class="subtitulo">Entre para acessar o sistema da Leide Farias.</p>

            <div id="login-mensagem" class="mensagem mensagem--erro" role="alert" hidden></div>

            <form id="form-login" novalidate>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="username" required autofocus>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="senha-com-botao">
                        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
                        <button type="button" id="mostrar-senha" class="botao-secundario" aria-pressed="false"
                                aria-controls="senha">Mostrar</button>
                    </div>
                </div>

                <button type="submit" id="botao-entrar">Entrar</button>
            </form>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
